[package]
name = "gyroflow-ofx"
version.workspace = true
authors = ["Adrian <adrian.eddy@gmail.com>", "Ilya Epifanov <elijah.epifanov@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2024"
description = "Gyroflow OpenFX plugin"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[features]
# This precision experiment is independent of platform/host admission.
integer-fragment-sampling = []

[dependencies]
gyroflow-plugin-base = { path = "../common" }
ofx = "0.3"
log = "0.4"
regex = "1.12"
libloading = "0.8"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
roxmltree = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D11", "Win32_Security_Cryptography"] }

[build-dependencies]
winres = "0.1"
