[workspace]
members = ["adobe", "common", "finalcut", "frei0r", "openfx"]
resolver = "2"

[workspace.package]
version = "3.0.0"

[patch.crates-io]
ofx = { path = "vendor/ofx" }
ofx_sys = { git = "https://github.com/AdrianEddy/ofx-rs.git", rev = "0b15219" }

[profile.deploy]
inherits = "release"
codegen-units = 1
lto = true
strip = true
