[package]
name = "gyroflow_adobe"
version.workspace = true
authors = ["Adrian <adrian.eddy@gmail.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
gyroflow-plugin-base = { path = "../common" }
# Keep NiYien's CJK label fixes and the upstream Premiere Beta private-command fix.
after-effects = { version = "0.3", git = "https://github.com/NiYien/after-effects.git", rev = "6dc1912ae5e4ea0fe8ca5b10da5a68c1966a6bcc" }
premiere      = { version = "0.2", git = "https://github.com/NiYien/after-effects.git", rev = "6dc1912ae5e4ea0fe8ca5b10da5a68c1966a6bcc" }
#after-effects = { path = "../../after-effects/after-effects" }
#premiere = { path = "../../after-effects/premiere" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
pretty-hex = "0.4"
png = "0.18"
serde_json = "1"

win_dbg_logger = "0.1"
log-panics = { version = "2.1", features = ["with-backtrace"]}
ctor = "0.2"

[build-dependencies]
#pipl = { path = "../../after-effects/pipl" }
pipl = "0.1"
