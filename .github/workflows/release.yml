name: NiYien Plugins Release

run-name: Plugins ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_label || github.ref_name || github.sha }}

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_label:
        description: Optional label for a manual plugin build run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        targets: [
          { os: ubuntu-latest, type: linux },
          { os: macos-latest,  type: macos },
          { os: windows-2022,  type: windows }
        ]
    name: Gyroflow(Niyien) plugins for ${{ matrix.targets.type }}
    runs-on: ${{ matrix.targets.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/target
            ~/.cargo
            C:\Users\runneradmin\.cargo
          key: ${{ matrix.targets.type }}-gyroflow-plugins-0

      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@main
        with:
          vulkan-query-version: 1.3.204.0
          vulkan-components: Vulkan-Headers
          vulkan-use-cache: true

      - name: Install Mac certificates
        if: ${{ matrix.targets.os == 'macos-latest' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATES }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - uses: extractions/setup-just@v2

      - name: Build plugins (Windows)
        if: ${{ matrix.targets.type == 'windows' }}
        run: |
          just install-deps
          just deploy

      - name: Build plugins (macOS)
        if: ${{ matrix.targets.type == 'macos' }}
        env:
          SIGNING_FINGERPRINT: ${{ secrets.MACOS_CERTIFICATE_FINGERPRINT }}
        run: |
          just install-deps
          just deploy
          xcrun notarytool submit --wait --apple-id ${{ secrets.MACOS_ACCOUNT_USER }} --team-id ${{ secrets.MACOS_TEAM }} --password ${{ secrets.MACOS_ACCOUNT_PASS }} ${{ github.workspace }}/target/GyroflowNiyien-OpenFX-macos.dmg
          xcrun stapler staple --verbose ${{ github.workspace }}/target/GyroflowNiyien-OpenFX-macos.dmg
          xcrun notarytool submit --wait --apple-id ${{ secrets.MACOS_ACCOUNT_USER }} --team-id ${{ secrets.MACOS_TEAM }} --password ${{ secrets.MACOS_ACCOUNT_PASS }} ${{ github.workspace }}/target/GyroflowNiyien-Adobe-macos.dmg
          xcrun stapler staple --verbose ${{ github.workspace }}/target/GyroflowNiyien-Adobe-macos.dmg

      - name: Build plugins (Linux)
        if: ${{ matrix.targets.type == 'linux' }}
        run: |
          sudo docker run -v ${{ github.workspace }}:${{ github.workspace }} -v $HOME/.cargo:/root/.cargo debian:bullseye bash -c "
            set -e
            apt-get update -y
            echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
            apt install -y sudo dialog apt-utils git curl zip clang make python3 ocl-icd-opencl-dev libwayland-client0 libwayland-dev
            export RUNLEVEL=1
            export CC=clang
            export CXX=clang++
            export CC_x86_64_unknown_linux_gnu=clang
            export CXX_x86_64_unknown_linux_gnu=clang++
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
            source \$HOME/.cargo/env
            cargo install just
            cd ${{ github.workspace }}
            just install-deps
            just deploy
            python3 scripts/verify_linux_openfx_package.py target/GyroflowNiyien-OpenFX-linux.zip
          "
          sudo chown -R $(id -u):$(id -g) $HOME/.cargo
          sudo chown -R $(id -u):$(id -g) ${{ github.workspace }}/target

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.targets.type != 'macos' }}
        with:
          name: GyroflowNiyien-OpenFX-${{ matrix.targets.type }}
          path: target/GyroflowNiyien-OpenFX*
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.targets.type == 'windows' }}
        with:
          name: GyroflowNiyien-Adobe-${{ matrix.targets.type }}
          path: target/GyroflowNiyien-Adobe-*
      - uses: actions/upload-artifact@v4
        with:
          name: GyroflowNiyien-frei0r-${{ matrix.targets.type }}
          path: target/libgyroflow_niyien_frei0r*

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.targets.type == 'macos' }}
        with:
          name: GyroflowNiyien-OpenFX-${{ matrix.targets.type }}
          path: target/GyroflowNiyien-OpenFX-macos.dmg
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.targets.type == 'macos' }}
        with:
          name: GyroflowNiyien-Adobe-${{ matrix.targets.type }}
          path: target/GyroflowNiyien-Adobe-macos.dmg

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.targets.type == 'macos' }}
        with:
          name: GyroflowNiyien-OpenFX-${{ matrix.targets.type }}-zip
          path: target/GyroflowNiyien-OpenFX-macos.zip
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.targets.type == 'macos' }}
        with:
          name: GyroflowNiyien-Adobe-${{ matrix.targets.type }}-zip
          path: target/GyroflowNiyien-Adobe-macos.zip

  github_release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build_finalcut]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true
      - name: Verify required Final Cut deliverable
        run: test -s release_artifacts/GyroflowNiyien-FinalCut-macos.zip
      - name: Reject an existing tag release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: context.ref.replace('refs/tags/', '')
              });
              core.setFailed('Refusing to overwrite an existing release');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: Publish exact deliverables
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            release_artifacts/GyroflowNiyien-OpenFX-windows.zip
            release_artifacts/GyroflowNiyien-OpenFX-linux.zip
            release_artifacts/GyroflowNiyien-OpenFX-macos.dmg
            release_artifacts/GyroflowNiyien-OpenFX-macos.zip
            release_artifacts/GyroflowNiyien-Adobe-windows.aex
            release_artifacts/GyroflowNiyien-Adobe-macos.dmg
            release_artifacts/GyroflowNiyien-Adobe-macos.zip
            release_artifacts/libgyroflow_niyien_frei0r.so
            release_artifacts/libgyroflow_niyien_frei0r.dylib
            release_artifacts/libgyroflow_niyien_frei0r.dll
            release_artifacts/GyroflowNiyien-FinalCut-macos.zip
            release_artifacts/GyroflowNiyien-FinalCut-macos.dmg

  check_finalcut:
    name: Final Cut distribution contracts
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - name: Check branding, SDK, signing and delivery contracts
        run: python3 -m unittest discover -s tests -p test_finalcut_distribution_contract.py
      - name: Check localization generation
        run: python3 scripts/generate_finalcut_localizations.py --check
      - name: Check host language switching and sandbox scope
        run: python3 -m unittest tests.test_finalcut_host_localization tests.test_finalcut_release_contract.FinalCutPackageBuildContractTests.test_wrapper_and_xpc_signed_entitlement_policy_is_fail_closed

  build_finalcut:
    name: NiYien FCP signed universal package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: check_finalcut
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NIYIEN_LENS_DATA_TAG: data-v20260830.1
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned source and release acceptance
        run: python3 scripts/finalcut_release.py prepare
      - name: Install pinned Rust targets
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: finalcut-macos-26-rust-1.95.0
      - name: Verify the selected toolchain
        run: python3 scripts/finalcut_release.py check-toolchain
      - name: Cache the pinned SDK download
        uses: actions/cache@v4
        with:
          path: ext/fxplug
          key: fxplug-macos-26-${{ hashFiles('finalcut/config/sdk.json') }}
      - name: Download, verify and install FxPlug SDK
        env:
          FINALCUT_SDK_URL: ${{ vars.FINALCUT_SDK_URL }}
          SDK_BASE: ${{ vars.SDK_BASE || 'https://www.niyien.com/api/sdk' }}
        run: python3 scripts/prepare_finalcut_sdk.py --install
      - name: Validate signing configuration
        env:
          MACOS_CERTIFICATES: ${{ secrets.MACOS_CERTIFICATES }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_FINGERPRINT: ${{ secrets.MACOS_CERTIFICATE_FINGERPRINT }}
          MACOS_ACCOUNT_USER: ${{ secrets.MACOS_ACCOUNT_USER }}
          MACOS_TEAM: ${{ secrets.MACOS_TEAM }}
          MACOS_ACCOUNT_PASS: ${{ secrets.MACOS_ACCOUNT_PASS }}
        run: |
          python3 - <<'PYCONFIG'
          import os
          names = ('MACOS_CERTIFICATES', 'MACOS_CERTIFICATE_PWD', 'MACOS_CERTIFICATE_FINGERPRINT',
                   'MACOS_ACCOUNT_USER', 'MACOS_TEAM', 'MACOS_ACCOUNT_PASS')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing signing configuration: ' + ', '.join(missing))
          PYCONFIG
      - name: Install Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATES }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      - name: Build and sign Final Cut package
        env:
          SIGNING_FINGERPRINT: ${{ secrets.MACOS_CERTIFICATE_FINGERPRINT }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_TEAM }}
        run: |
          python3 scripts/finalcut_release.py check-signing
          python3 scripts/build_finalcut_package.py --output-dir release-finalcut
      - name: Notarize, staple and verify final ZIP
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_ACCOUNT_USER }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_TEAM }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_ACCOUNT_PASS }}
        run: >-
          python3 scripts/notarize_finalcut_package.py
          --app "release-finalcut/NiYien FCP.app"
          --zip release-finalcut/GyroflowNiyien-FinalCut-macos.zip
          --result release-finalcut/notary-result.json
      - name: Record final input and artifact hashes
        run: python3 scripts/finalcut_release.py summary --directory release-finalcut
      - name: Build and notarize drag-to-Applications installer
        env:
          SIGNING_FINGERPRINT: ${{ secrets.MACOS_CERTIFICATE_FINGERPRINT }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_ACCOUNT_USER }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_TEAM }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_ACCOUNT_PASS }}
        run: >-
          python3 scripts/build_finalcut_dmg.py
          --app "release-finalcut/NiYien FCP.app"
          --output release-finalcut/GyroflowNiyien-FinalCut-macos.dmg
          --notarize
      - name: Upload drag-to-Applications installer
        uses: actions/upload-artifact@v4
        with:
          name: GyroflowNiyien-FinalCut-macos-dmg
          path: release-finalcut/GyroflowNiyien-FinalCut-macos.dmg
          if-no-files-found: error
      - name: Upload directly consumable Final Cut ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GyroflowNiyien-FinalCut-macos
          path: release-finalcut/GyroflowNiyien-FinalCut-macos.zip
          if-no-files-found: error
      - name: Upload release evidence separately
        uses: actions/upload-artifact@v4
        with:
          name: finalcut-release-evidence
          path: |
            release-finalcut/notary-result.json
            release-finalcut/finalcut-release-summary.json
            release-finalcut/GyroflowNiyien-FinalCut-macos.json
          if-no-files-found: error
